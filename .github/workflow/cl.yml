name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component rustfmt \
            --component clippy

      - name: Check formatting
        run: cargo +stable fmt --check

      - name: Run tests
        run: cargo +stable test --all-features

      - name: Run Clippy
        run: cargo +stable clippy --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo +stable doc --no-deps --all-features

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Test MSRV
        run: cargo +1.85.0 test --all-features
